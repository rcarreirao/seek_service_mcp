services:
  mysql:
    image: mysql:8.0
    container_name: seek-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seek_service
      MYSQL_USER: seek
      MYSQL_PASSWORD: seek
    ports:
      - "${SEEK_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-useek", "-pseek"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: